<html>
<head>
	<title>Register</title>
</head>
<body>
	<h2>Register</h2>
	<!-- Form posts username, e-mail, and password to the /register endpoint -->
	<form action="/register" method="POST">
		<label for="username">Username</label><br>
		<input type="text" name="username" id="username" size="20" required /><br>

		<label for="email">E-mail</label><br>
		<input type="email" name="email" id="email" size="40" required /><br>

		<label for="password">Password</label><br>
		<input type="password" name="password" id="password" size="30" required /><br>

		<input type="submit" value="Register" />
	</form>
	<p>Already have an account? <a href="login.html">Login</a></p>
</body>
</html>
